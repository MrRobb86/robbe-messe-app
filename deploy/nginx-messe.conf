# nginx-Konfiguration fuer das RobbeVersum (messe.robbe-consulting.de).
# Ablage auf dem VPS: /etc/nginx/sites-available/messe.robbe-consulting.de
# Aktivieren: ln -s ../sites-available/messe.robbe-consulting.de /etc/nginx/sites-enabled/
# HTTPS danach via: certbot --nginx -d messe.robbe-consulting.de
server {
    listen 80;
    server_name messe.robbe-consulting.de;

    root /var/www/robbeversum;
    index index.html;

    # SPA: alle Pfade auf index.html (Service Worker/PWA-Assets direkt).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Assets lange cachen; index.html + Service Worker nie.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
